<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Ahcik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            🍔 Burger Ahcik
        </div>
        <button class="cart-button" onclick="openCart()">
            🛒 Cart
            <span id="cart-count">0</span>
        </button>
    </header>
    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Burger Ahcik 🍔</h1>
            <p>Burger panas, sedap & puas hati!</p>
            <a href="#menu" class="hero-button">
                Lihat Menu
            </a>
        </div>
    </section>
    <!-- MENU -->
    <section class="menu-section" id="menu">
        <h2>🍔 Menu Kami</h2>
        <p class="menu-subtitle">
            Pilih burger kegemaran anda
        </p>
        <div class="menu-grid" id="menu-container">
</div>
    </section>
    <!-- CART -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeCart()">
                ✕
            </button>
            <h2>🛒 Cart Anda</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                Jumlah: RM<span id="cart-total">0.00</span>
            </div>
            <button class="checkout-button" onclick="openCheckout()">
                Checkout
            </button>
        </div>
    </div>
    <!-- CHECKOUT -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeCheckout()">
                ✕
            </button>
            <h2>🧾 Maklumat Order</h2>
            <form id="checkout-form">
                <label>Nama</label>
                <input
                    type="text"
                    id="customer-name"
                    placeholder="Masukkan nama"
                    required
                >
                <label>No. Telefon</label>
                <input
                    type="tel"
                    id="customer-phone"
                    placeholder="Contoh: 0123456789"
                    required
                >
                <label>Cara Dapatkan Order</label>
                <div class="delivery-options">
                    <label class="option">
                        <input
                            type="radio"
                            name="order-type"
                            value="COD"
                            onchange="toggleAddress()"
                            checked
                        >
                        🛵 Delivery (COD)
                    </label>
                    <label class="option">
                        <input
                            type="radio"
                            name="order-type"
                            value="Pickup"
                            onchange="toggleAddress()"
                        >
                        🏪 Pickup
                    </label>
                </div>
                <div id="address-section">
                    <label>Alamat Penghantaran</label>
                    <textarea
                        id="customer-address"
                        placeholder="Masukkan alamat penuh"
                    ></textarea>
                </div>
                <label>Nota Order</label>
                <textarea
                    id="order-note"
                    placeholder="Contoh: Tak nak bawang"
                ></textarea>
                <button
                    type="submit"
                    class="order-button"
                >
                    📲 Hantar Order
                </button>
            </form>
        </div>
    </div>
    <footer>
        <p>© 2026 Burger Ahcik 🍔</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
